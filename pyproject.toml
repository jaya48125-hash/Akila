[project]
name = "akila"
version = "0.1.0"
description = "AKILA Ultra Voice Assistant"
requires-python = ">=3.10"
dependencies = [
  "flet>=1.0.0",
]

[tool.flet]
org = "com.akila"
product = "AKILA"
impeller = false
permissions = ["microphone"]

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.RECORD_AUDIO" = true
