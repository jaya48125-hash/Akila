name: Build AKILA Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Organize Android files and Download Vosk Model
        run: |
          mkdir -p app/src/main/java/com/akila/assistant app/src/main/assets
          [ -f src/main/AndroidManifest.xml ] && mv src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml || true
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/akila/assistant/MainActivity.kt || true
          [ -f AkilaWakeService.kt ] && mv AkilaWakeService.kt app/src/main/java/com/akila/assistant/AkilaWakeService.kt || true
          if [ ! -d app/src/main/assets/model-en-in ]; then
            curl -L -s https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip -o vosk.zip
            unzip -q vosk.zip -d app/src/main/assets
            mv app/src/main/assets/vosk-model-small-en-in-0.4 app/src/main/assets/model-en-in
            rm vosk.zip
          fi

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build AKILA APK
        run: gradle assembleDebug

      - name: Upload AKILA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: akila-android-apk
          path: app/build/outputs/apk/debug/*.apk
