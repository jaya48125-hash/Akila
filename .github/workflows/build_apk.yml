name: Build AKILA Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Flet and Build AKILA APK
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]" httpx
          flet build apk --yes --verbose

      - name: Upload AKILA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: akila-android-apk
          path: build/apk/*.apk
