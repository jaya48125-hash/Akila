name: Build AKILA Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Android APK with Flet
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          project-directory: .

      - name: Upload AKILA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: akila-android-apk
          path: build/apk/*.apk
